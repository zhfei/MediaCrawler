<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Maps 采集控制台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --panel: #ffffff;
        --text: #172033;
        --muted: #667085;
        --line: #d7dde8;
        --accent: #166534;
        --accent-2: #2563eb;
        --danger: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 17px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }
      .span-4 {
        grid-column: span 4;
      }
      .span-6 {
        grid-column: span 6;
      }
      .span-8 {
        grid-column: span 8;
      }
      .span-12 {
        grid-column: span 12;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      .stat strong {
        display: block;
        font-size: 24px;
      }
      .stat span,
      label,
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      label {
        display: block;
        margin-bottom: 6px;
      }
      input,
      select,
      button {
        min-height: 38px;
        border-radius: 7px;
        border: 1px solid var(--line);
        font: inherit;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        background: #fff;
      }
      button {
        padding: 8px 13px;
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        border-color: var(--accent-2);
        color: var(--accent-2);
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      .file-picker {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .file-picker input[type="file"] {
        display: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 8px;
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      pre {
        margin: 0;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
      }
      @media (max-width: 820px) {
        .span-4,
        .span-6,
        .span-8 {
          grid-column: span 12;
        }
        .stats,
        .form-grid {
          grid-template-columns: 1fr;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Google Maps 采集控制台</h1>
          <div class="muted" id="pointsFile">加载中...</div>
        </div>
        <div class="actions">
          <button class="secondary" id="refreshBtn">刷新</button>
          <button id="exportCsvBtn">导出 CSV</button>
          <button id="exportJsonBtn">导出 JSON</button>
          <button class="danger" id="stopBtn">停止</button>
        </div>
      </header>

      <section class="grid">
        <div class="panel span-8">
          <h2>任务概览</h2>
          <div class="stats">
            <div class="stat"><strong id="points">0</strong><span>点位</span></div>
            <div class="stat"><strong id="keywords">0</strong><span>关键词</span></div>
            <div class="stat"><strong id="plannedTasks">0</strong><span>计划任务</span></div>
            <div class="stat"><strong id="shops">0</strong><span>店铺</span></div>
          </div>
        </div>

        <div class="panel span-4">
          <h2>状态分布</h2>
          <table>
            <tbody id="statusTable"></tbody>
          </table>
        </div>

        <div class="panel span-12">
          <h2>启动采集</h2>
          <div class="form-grid">
            <div>
              <label for="saveOption">保存方式</label>
              <select id="saveOption">
                <option value="sqlite">SQLite Database</option>
              </select>
            </div>
            <div>
              <label for="taskLimit">任务数量</label>
              <input id="taskLimit" type="number" min="0" value="1" />
            </div>
            <div>
              <label for="maxLinks">单任务店铺上限</label>
              <input id="maxLinks" type="number" min="1" value="20" />
            </div>
            <div>
              <label for="maxRetries">失败重试次数</label>
              <input id="maxRetries" type="number" min="0" value="2" />
            </div>
            <div>
              <label for="headless">浏览器模式</label>
              <select id="headless">
                <option value="false">有界面</option>
                <option value="true">无头</option>
              </select>
            </div>
            <div>
              <label for="pointsInput">点位文件</label>
              <div class="file-picker">
                <input id="pointsInput" type="text" readonly placeholder="请选择 CSV 点位文件" />
                <button id="choosePointsBtn" type="button">选择文件</button>
                <input id="pointsFilePicker" type="file" accept=".csv,text/csv" />
              </div>
            </div>
            <div>
              <label for="resetStatus">重置状态</label>
              <select id="resetStatus">
                <option value="failed">failed</option>
                <option value="running">running</option>
                <option value="pending">pending</option>
              </select>
            </div>
          </div>
          <div class="actions">
            <button class="primary" id="startBtn">启动</button>
            <button id="previewBtn">预览任务</button>
            <button id="resetBtn">重置任务</button>
          </div>
        </div>

        <div class="panel span-6">
          <h2>任务预览</h2>
          <table>
            <thead>
              <tr>
                <th>城市</th>
                <th>坐标</th>
                <th>关键词</th>
              </tr>
            </thead>
            <tbody id="previewTable"></tbody>
          </table>
        </div>

        <div class="panel span-6">
          <h2>运行日志</h2>
          <pre id="logs">等待启动...</pre>
        </div>

        <div class="panel span-12">
          <h2>采集报告</h2>
          <div class="grid">
            <div class="span-4">
              <table>
                <thead><tr><th>关键词</th><th>命中</th></tr></thead>
                <tbody id="keywordReport"></tbody>
              </table>
            </div>
            <div class="span-4">
              <table>
                <thead><tr><th>分类</th><th>店铺</th></tr></thead>
                <tbody id="categoryReport"></tbody>
              </table>
            </div>
            <div class="span-4">
              <table>
                <thead><tr><th>状态</th><th>店铺</th></tr></thead>
                <tbody id="stateReport"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let selectedPointsFile = "";
      let initialConfigLoaded = false;

      async function request(path, options = {}) {
        const response = await fetch(path, options);
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      }

      async function jsonRequest(path, options = {}) {
        return request(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
      }

      async function refresh() {
        const [summary, status, logs, report] = await Promise.all([
          jsonRequest("/api/google-maps/summary"),
          jsonRequest("/api/google-maps/tasks/status"),
          jsonRequest("/api/crawler/logs?limit=80"),
          jsonRequest("/api/google-maps/report"),
        ]);
        $("pointsFile").textContent = summary.points_file;
        $("points").textContent = summary.points;
        $("keywords").textContent = summary.keywords;
        $("plannedTasks").textContent = summary.planned_tasks;
        $("shops").textContent = summary.db.google_maps_shops || 0;
        if (!initialConfigLoaded) {
          $("taskLimit").value = summary.task_limit;
          $("maxLinks").value = summary.max_result_links_per_task;
          $("maxRetries").value = summary.max_retry_times;
          initialConfigLoaded = true;
        }
        if (!selectedPointsFile) {
          selectedPointsFile = summary.points_file;
          $("pointsInput").value = summary.points_file;
        }
        $("statusTable").innerHTML = Object.entries(status.status || {})
          .map(([key, value]) => `<tr><td>${key}</td><td>${value}</td></tr>`)
          .join("") || "<tr><td>empty</td><td>0</td></tr>";
        $("logs").textContent = (logs.logs || [])
          .map((item) => `[${item.timestamp}] ${item.level.toUpperCase()} ${item.message}`)
          .join("\n") || "暂无日志";
        renderReport("keywordReport", report.top_keywords);
        renderReport("categoryReport", report.top_categories);
        renderReport("stateReport", report.shop_states);
      }

      function renderReport(id, items) {
        $(id).innerHTML = (items || [])
          .map((item) => `<tr><td>${item.name || "empty"}</td><td>${item.count}</td></tr>`)
          .join("") || "<tr><td>暂无</td><td>0</td></tr>";
      }

      async function previewTasks() {
        const query = selectedPointsFile ? `&points_file=${encodeURIComponent(selectedPointsFile)}` : "";
        const data = await jsonRequest(`/api/google-maps/tasks/preview?limit=20${query}`);
        $("previewTable").innerHTML = data.items
          .map((item) => `<tr><td>${item.city}</td><td>${item.crawl_lat}, ${item.crawl_lng}</td><td>${item.keyword}</td></tr>`)
          .join("");
      }

      async function startCrawler() {
        const pointsFile = selectedPointsFile || $("pointsInput").value.trim();
        await jsonRequest("/api/crawler/start", {
          method: "POST",
          body: JSON.stringify({
            platform: "google_maps",
            login_type: "qrcode",
            crawler_type: "search",
            save_option: $("saveOption").value,
            headless: $("headless").value === "true",
            enable_comments: false,
            enable_sub_comments: false,
            google_maps_task_limit: Number($("taskLimit").value || 1),
            google_maps_max_result_links_per_task: Number($("maxLinks").value || 20),
            google_maps_max_retry_times: Number($("maxRetries").value || 2),
            google_maps_points_file: pointsFile,
          }),
        });
        await refresh();
      }

      async function stopCrawler() {
        await jsonRequest("/api/crawler/stop", { method: "POST" });
        await refresh();
      }

      async function resetTasks() {
        await jsonRequest("/api/google-maps/tasks/reset", {
          method: "POST",
          body: JSON.stringify({ status: $("resetStatus").value, limit: 0 }),
        });
        await refresh();
      }

      async function uploadPointsFile(file) {
        if (!file) return;
        const response = await fetch("/api/google-maps/points/upload", {
          method: "POST",
          headers: {
            "Content-Type": "text/csv; charset=utf-8",
            "X-Filename": encodeURIComponent(file.name),
          },
          body: await file.arrayBuffer(),
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        const data = await response.json();
        selectedPointsFile = data.points_file;
        $("pointsInput").value = data.points_file;
        $("pointsFile").textContent = data.points_file;
        $("points").textContent = data.points;
        $("plannedTasks").textContent = data.planned_tasks;
        await previewTasks();
      }

      $("refreshBtn").addEventListener("click", refresh);
      $("choosePointsBtn").addEventListener("click", () => {
        $("pointsFilePicker").click();
      });
      $("pointsFilePicker").addEventListener("change", async (event) => {
        try {
          await uploadPointsFile(event.target.files[0]);
        } catch (error) {
          $("logs").textContent = error.message;
        }
      });
      $("exportCsvBtn").addEventListener("click", () => {
        window.location.href = "/api/google-maps/export?file_type=csv";
      });
      $("exportJsonBtn").addEventListener("click", () => {
        window.location.href = "/api/google-maps/export?file_type=json";
      });
      $("previewBtn").addEventListener("click", previewTasks);
      $("startBtn").addEventListener("click", startCrawler);
      $("stopBtn").addEventListener("click", stopCrawler);
      $("resetBtn").addEventListener("click", resetTasks);
      refresh().then(previewTasks).catch((error) => {
        $("logs").textContent = error.message;
      });
      setInterval(refresh, 5000);
    </script>
  </body>
</html>
